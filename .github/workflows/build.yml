name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  GO_VERSION: '1.25.x'

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Fetch sing-box for config validation
        run: |
          version="$(cat scripts/core_version.txt)"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "SING_BOX_BIN=$RUNNER_TEMP/sing-box-${version}-linux-amd64/sing-box" >> "$GITHUB_ENV"
      - name: Validate generated configs with the real core
        run: flutter test --tags singbox

  android:
    name: Android APKs
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Private-repo runners have little free disk; the Go + Gradle builds
      # need ~10 GB. Drop preinstalled toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
      - name: Build libbox.aar
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" scripts/build_libbox.sh
      - name: Drop Go caches
        # ~4 GB of build cache for three Android ABIs, not needed any more.
        run: |
          go clean -cache -modcache
          rm -rf .core-build
          df -h /
      - name: Build APKs
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: aghelan-ghiamat-android
          path: build/app/outputs/flutter-apk/*-release.apk

  windows:
    name: Windows x64
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch sing-box core
        shell: pwsh
        run: ./scripts/fetch_core_windows.ps1
      - name: Build
        run: flutter build windows --release
      # GitHub zips artifacts itself; uploading the folder avoids a zip
      # inside a zip with the same name.
      - uses: actions/upload-artifact@v4
        with:
          name: aghelan-ghiamat-windows-x64
          path: build/windows/x64/runner/Release/
