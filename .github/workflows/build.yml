name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'
  GO_VERSION: '1.25.x'

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Fetch sing-box for config validation
        run: |
          version="$(cat scripts/core_version.txt)"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "SING_BOX_BIN=$RUNNER_TEMP/sing-box-${version}-linux-amd64/sing-box" >> "$GITHUB_ENV"
      - name: Validate generated configs with the real core
        run: flutter test --tags singbox

  android:
    name: Android APKs
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
      - name: Build libbox.aar
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" scripts/build_libbox.sh
      - name: Build APKs
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: aghelan-ghiamat-android
          path: build/app/outputs/flutter-apk/*-release.apk

  windows:
    name: Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch sing-box core
        shell: pwsh
        run: ./scripts/fetch_core_windows.ps1
      - name: Build
        run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath aghelan-ghiamat-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aghelan-ghiamat-windows-x64
          path: aghelan-ghiamat-windows-x64.zip
