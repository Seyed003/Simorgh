name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege; only the release job may write.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'
  GO_VERSION: '1.25.x'

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: scripts/*_version.txt
      - name: Build the core (sing-box + Xray) and an Xray test server
        run: |
          scripts/build_core.sh linux amd64 "$RUNNER_TEMP/sing-box"
          GOBIN="$RUNNER_TEMP/xray" go install "github.com/xtls/xray-core/main@$(cat scripts/xray_version.txt)"
          echo "SING_BOX_BIN=$RUNNER_TEMP/sing-box" >> "$GITHUB_ENV"
          echo "XRAY_BIN=$RUNNER_TEMP/xray/main" >> "$GITHUB_ENV"
      - name: Validate generated configs with the real core
        run: flutter test --tags singbox

  android:
    name: Android APKs
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Private-repo runners have little free disk; the Go + Gradle builds
      # need ~10 GB. Drop preinstalled toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
      - name: Build libbox.aar
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" scripts/build_libbox.sh
      - name: Drop Go caches
        # ~4 GB of build cache for three Android ABIs, not needed any more.
        run: |
          go clean -cache -modcache
          rm -rf .core-build
          df -h /
      - name: Release signing key
        # One key for every build of main and of release tags, so a new APK
        # installs over the old one (and keeps the configs). Pull requests
        # never get the key: their APKs carry this runner's throwaway debug
        # signature. A release tag without the key fails rather than ship
        # APKs that cannot update the installed app.
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are not set; refusing to release debug-signed APKs."
              exit 1
            fi
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are not set; APKs get a throwaway debug signature and will not update each other."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=aghelan
          keyPassword=$KEYSTORE_PASSWORD
          EOF
      - name: Build APKs
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --split-per-abi
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aghelan-ghiamat-android
          path: build/app/outputs/flutter-apk/*-release.apk

  windows:
    name: Windows x64
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: scripts/*_version.txt
      - name: Build the core (sing-box + Xray)
        shell: bash
        run: scripts/build_core_windows.sh amd64
      - name: Build
        run: |
          flutter pub get --enforce-lockfile
          flutter build windows --release
      # GitHub zips artifacts itself; uploading the folder avoids a zip
      # inside a zip with the same name.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aghelan-ghiamat-windows-x64
          path: build/windows/x64/runner/Release/

  release:
    name: GitHub release
    # A pushed tag such as v0.2.0 publishes the APKs and the Windows zip;
    # the app's update check reads the latest release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir dist
          cp artifacts/aghelan-ghiamat-android/*.apk dist/
          (cd artifacts/aghelan-ghiamat-windows-x64 && zip -qr "$GITHUB_WORKSPACE/dist/aghelan-ghiamat-windows-x64.zip" .)
          ls -la dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
