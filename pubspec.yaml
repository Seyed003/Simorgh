name: aghelan_ghiamat
description: "Aghelan Ghiamat (عاقلان قیامت) - open-source VPN client for Android and Windows powered by sing-box."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  uuid: ^4.6.0
  http: ^1.6.0
  camera: ^0.12.1
  zxing2: ^0.2.4
  image: ^4.12.0
  file_picker: ^13.1.0
  qr_flutter: ^4.1.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/tray/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
